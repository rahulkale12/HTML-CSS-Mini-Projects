<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendulum</title>
  <style>
    *{
      margin:0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      /* width: 100vw; */
      height: 100vh;
      background-color: rgb(76, 59, 59);
      display: flex;
      justify-content: center;
      align-items: center;
      
    }

    .pendulum{
      width: 30rem;
      height: 20rem;
      background-color: transparent;
      border-top: 1rem solid  rgb(210,290,190);
      display: flex;
      justify-content: center;
      gap: 50px;


    }
    div{
      width: .6rem;
      height: 10rem;
      background-color: rgb(21, 172, 165);
      position: relative;
    }

    .pendulum div::before{
      content: "";
      position: absolute;
      width: 3.7rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background-color: brown;
      top: 9.7rem;
      left: -25px;
      
    }

    .pendulum div:first-child{
      animation: left-swing 2s linear infinite  ;
      transform-origin: top left;

    }

    .pendulum div:last-child{
      animation: right-swing 2s linear 1s infinite ;
      transform-origin: top right;
    }

    @keyframes left-swing {
      0%{
        rotate: 0deg;
      }
      25%{
        rotate: 30deg;
      }
      50%{
        rotate: 0deg;
      }
      100%{
        rotate: 0;
        
      }
      
    }

    @keyframes right-swing {
      0%{
        rotate: 0deg;
      }
      25%{
        rotate: -30deg;
      }
      50%{
        rotate: 0deg;
      }
      100%{
        rotate: 0;
        
      }
      
    }
  </style>
</head>
<body>
  <div class="pendulum">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>

  </div>
</body>
</html>
