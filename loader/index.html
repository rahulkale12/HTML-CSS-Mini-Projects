<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loader</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body{
      width: 100vw;
      height: 100vh;
      background-color: blanchedalmond;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader{
      width: 20rem;
      aspect-ratio:1;
      border-radius: 50%;
      background-color: coral;
      position: relative;
      animation: moving 3s linear infinite;
    }

    .loader::before{
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 17rem;
      aspect-ratio: 1;
      background-color:  blanchedalmond;
      border-radius: 50%;
    
    }

    

    .loader::after{
      content: "";
      position: absolute;
      width: 4.5rem;
      aspect-ratio: 1;
      border-radius: 50%;
      left: 80px;
      top: -20px;
      
      box-shadow: 0 0 16px rgb(100, 237, 223);
      background-color: rgb(100, 237, 223);
      
    }

    @keyframes moving{
      0%{
        transform: rotate(0deg);
      }
      100%{
        transform: rotate(-360deg);
      }
    }
 




  </style>
</head>
<body>
  <div class="loader"></div>
</body>
</html>
